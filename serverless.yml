service: xoc-reportes

org: stevericapa

frameworkVersion: "4"

provider:
  name: aws
  runtime: python3.10
  region: us-east-1
  stage: dev
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - bedrock:InvokeModel
          Resource:
            - arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-3-5-sonnet-20240620-v1:0
            - arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-3-sonnet-20240229-v1:0
  environment:
    ANALYTICS_MOCK_FUNCTION: ${self:service}-${self:provider.stage}-analyticsMock
    TRANSIA_XML_FUNCTION: ${self:service}-${self:provider.stage}-transiaXml
    CONVERTIR_DOCX_FUNCTION: ${self:service}-${self:provider.stage}-convertirDocx
    BUCKET_REPORTES: reportes-generales-${self:provider.stage}-xoc
    ANALYTICS_REAL_FUNCTION: Analytics
    BEDROCK_MODEL_ID: ${env:BEDROCK_MODEL_ID, 'anthropic.claude-3-5-sonnet-20240620-v1:0'}

package:
  patterns:
    - '!node_modules/**'
    - '!package-lock.json'
    - '!package.json'
    - src/**
    - _vendor/**
    - templates/**

resources:
  Resources:
    ReportesBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: reportes-generales-${self:provider.stage}-xoc
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        LifecycleConfiguration:
          Rules:
            - Id: ExpireOldReports
              Status: Enabled
              ExpirationInDays: 90

functions:
  generarreporte:
    handler: src/generarreporte.handler
    description: Orquestador - recibe formulario, llama Analytics/AnalyticsMock, formatea datos, invoca Transia_XML
    timeout: 29
    memorySize: 512
    events:
      - http:
          path: /reporte/generar
          method: post
          cors: true
          integration: lambda-proxy

  analyticsMock:
    handler: src/analytics_mock.handler
    description: Mock de Analytics - devuelve data falsa con el mismo formato que el Analytics real
    timeout: 15
    memorySize: 256

  transiaXml:
    handler: src/transia_xml.handler
    description: Recibe datos formateados, llama a AWS Bedrock (Claude 3.5 Sonnet), genera JSON profesional, invoca convertir_a_docx
    timeout: 30
    memorySize: 1024

  convertirDocx:
    handler: src/convertir_a_docx.handler
    description: Recibe JSON desde transiaXml, convierte a DOCX con docxtpl, sube a S3
    timeout: 15
    memorySize: 1024

outputs:
  ApiUrl:
    Description: URL del API Gateway para invocar generarreporte
    Value:
      Fn::Sub: https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/${self:provider.stage}/reporte/generar
  BucketName:
    Description: Nombre del bucket S3 donde se almacenan los reportes DOCX
    Value: { Ref: ReportesBucket }
