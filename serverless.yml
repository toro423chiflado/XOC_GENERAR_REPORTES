service: xoc-reportes

org: torochiflado

frameworkVersion: "3"

plugins:
  - serverless-python-requirements

provider:
  name: aws
  runtime: python3.11
  region: us-east-1
  stage: dev
  role: arn:aws:iam::400315371118:role/LabRole
  environment:
    ANALYTICS_MOCK_FUNCTION: ${self:service}-${self:provider.stage}-analyticsMock
    TRANSIA_XML_FUNCTION: ${self:service}-${self:provider.stage}-transiaXml
    CONVERTIR_DOCX_FUNCTION: ${self:service}-${self:provider.stage}-convertirDocx
    BUCKET_REPORTES: reportes-generales-${self:provider.stage}
    ANALYTICS_REAL_FUNCTION: Analytics
    GROQ_API_KEY: ${env:GROQ_API_KEY, ''}

custom:
  pythonRequirements:
    zip: true
    slim: false
    pythonBin: python3

resources:
  Resources:
    ReportesBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: reportes-generales-${self:provider.stage}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        LifecycleConfiguration:
          Rules:
            - Id: ExpireOldReports
              Status: Enabled
              ExpirationInDays: 90

functions:
  generarreporte:
    handler: src/generarreporte.handler
    description: Orquestador - recibe formulario, llama Analytics/AnalyticsMock, formatea datos, invoca Transia_XML
    timeout: 60
    memorySize: 256
    events:
      - http:
          path: /reporte/generar
          method: post
          cors: true
          integration: lambda-proxy

  analyticsMock:
    handler: src/analytics_mock.handler
    description: Mock de Analytics - devuelve data falsa con el mismo formato que el Analytics real
    timeout: 30
    memorySize: 256

  transiaXml:
    handler: src/transia_xml.handler
    description: Recibe datos formateados, llama a Groq (Llama 3.1 8B), genera XML, invoca convertir_a_docx
    timeout: 120
    memorySize: 512

  convertirDocx:
    handler: src/convertir_a_docx.handler
    description: Recibe XML desde transiaXml, convierte a DOCX con python-docx, sube a S3
    timeout: 60
    memorySize: 512

outputs:
  ApiUrl:
    Description: URL del API Gateway para invocar generarreporte
    Value:
      Fn::Sub: https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/${self:provider.stage}/reporte/generar
  BucketName:
    Description: Nombre del bucket S3 donde se almacenan los reportes DOCX
    Value: { Ref: ReportesBucket }
